name: bluetooth_messenger
description: Offline peer-to-peer messaging over Bluetooth with WhatsApp-style UI.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.11
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
