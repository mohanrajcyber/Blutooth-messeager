name: bluetooth_messenger
description: Offline peer-to-peer messaging over Bluetooth with WhatsApp-style UI.
publish_to: 'none'
version: 0.4.1+17

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^2.3.11
  ble_peripheral_plus: ^2.5.4
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.5
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  emoji_picker_flutter: ^4.3.0
  image_picker: ^1.1.2
  encrypt: ^5.0.3
  crypto: ^3.0.6
  record: ^6.0.0
  audioplayers: ^6.8.1
  file_picker: ^10.1.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  local_auth: ^2.3.0
  photo_view: ^0.15.0
  vibration: ^3.1.3
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
